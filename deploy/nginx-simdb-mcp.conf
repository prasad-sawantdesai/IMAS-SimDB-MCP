# TLS reverse proxy in front of the MCP server.
# Users send their password in the Authorization header, so plain HTTP must never be exposed.
# Place in /etc/nginx/conf.d/ (http context).

# Do not write credentials or query strings to the access log.
log_format simdb_mcp '$remote_addr [$time_local] "$request_method $uri" $status $request_time';

server {
    listen 443 ssl;
    server_name simdb-mcp.iter.org;

    ssl_certificate     /etc/pki/tls/certs/simdb-mcp.crt;
    ssl_certificate_key /etc/pki/tls/private/simdb-mcp.key;

    access_log /var/log/nginx/simdb-mcp.access.log simdb_mcp;

    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 80;
    server_name simdb-mcp.iter.org;
    return 301 https://$host$request_uri;
}
