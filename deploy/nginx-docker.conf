# nginx in docker compose (profile "tls"), in front of the simdb-mcp container.
# Put the certificate and key in deploy/certs/server.crt and deploy/certs/server.key.

# Do not write credentials or query strings to the access log.
log_format simdb_mcp '$remote_addr [$time_local] "$request_method $uri" $status $request_time';

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    access_log /var/log/nginx/access.log simdb_mcp;

    location /mcp {
        proxy_pass http://simdb-mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://simdb-mcp:8000;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
