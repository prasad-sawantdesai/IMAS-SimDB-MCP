[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imas-simdb-mcp"
version = "0.1.0"
description = "Read-only MCP server for searching IMAS SimDB simulation metadata"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "imas-python>=2.0",   # bundled IMAS Data Dictionary, for units/meaning of summary keys
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
docs = ["sphinx>=8", "myst-parser>=4", "sphinx-immaterial>=0.13"]
lint = ["ruff>=0.8"]

[project.scripts]
simdb-mcp = "simdb_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simdb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, import order, pyupgrade, simplifications
select = ["E", "W", "F", "B", "I", "UP", "SIM"]
ignore = [
    "SIM117",  # nested `with`: kept where the inner context depends on the outer one
]
