name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: |
          uvx ruff check --output-format=github .
          uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - name: Install
        run: uv pip install -e ".[test]"
      - name: Pytest
        run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - name: Install
        run: uv pip install -e ".[docs]"
      - name: Build (warnings are errors, as on Read the Docs)
        run: sphinx-build -W --keep-going docs docs/_build/html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t imas-simdb-mcp:ci .
      - name: Start and check /healthz
        run: |
          docker run -d --name simdb-mcp -p 8000:8000 imas-simdb-mcp:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker logs simdb-mcp
          exit 1
